<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AVCBtrack</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red:      #CC1B1B; --red-deep: #A01212;
  --red-glow: rgba(204,27,27,0.18); --red-soft: rgba(204,27,27,0.10);
  --gold:     #D4A843; --black: #0A0A0A; --ink: #111111;
  --panel:    #181818; --raised: #222222; --line: rgba(255,255,255,0.07);
  --white:    #F5F2ED; --muted: #706C68;
  --green:    #1FA851; --yellow: #E8A000; --blue: #2563EB;
  --f-display:'Bebas Neue',sans-serif;
  --f-cond:   'Barlow Condensed',sans-serif;
  --f-body:   'Barlow',sans-serif;
}
html { scroll-behavior:smooth; }
body { background:var(--black); color:var(--white); font-family:var(--f-body); font-size:14px; min-height:100vh; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); opacity:0.025; }

/* ── LOADING SCREEN ── */
#loading-screen {
  position:fixed; inset:0; background:var(--black); z-index:999;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
}
.ls-icon { font-size:52px; animation:pulse 1.4s ease-in-out infinite; }
.ls-title { font-family:var(--f-display); font-size:36px; letter-spacing:2px; color:var(--white); }
.ls-title em { color:var(--red); font-style:normal; }
.ls-sub { font-family:var(--f-cond); font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.ls-bar { width:200px; height:3px; background:var(--raised); border-radius:2px; overflow:hidden; margin-top:8px; }
.ls-bar-fill { height:100%; background:var(--red); border-radius:2px; animation:loading 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes loading { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }

/* ── AUTH SCREEN ── */
#auth-screen {
  position:fixed; inset:0; background:var(--black); z-index:998;
  display:none; align-items:center; justify-content:center; padding:20px;
}
.auth-card {
  background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--red);
  border-radius:8px; width:100%; max-width:420px; padding:36px;
  box-shadow:0 20px 60px rgba(0,0,0,.8);
}
.auth-logo { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.auth-logo-icon { width:46px; height:46px; background:var(--red); clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 0 20px var(--red-glow); }
.auth-logo-text { font-family:var(--f-display); font-size:30px; letter-spacing:1px; }
.auth-logo-text em { color:var(--red); font-style:normal; }
.auth-tabs { display:flex; gap:4px; background:var(--raised); border-radius:6px; padding:3px; margin-bottom:24px; }
.auth-tab { flex:1; padding:8px; border-radius:4px; border:none; background:transparent; color:var(--muted); font-family:var(--f-cond); font-size:13px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; transition:all .15s; }
.auth-tab.on { background:var(--red); color:#fff; }
.auth-field { margin-bottom:14px; }
.auth-field label { display:block; font-family:var(--f-cond); font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.auth-field input { width:100%; padding:11px 14px; border-radius:5px; border:1px solid var(--line); background:var(--raised); color:var(--white); font-family:var(--f-body); font-size:14px; outline:none; transition:border-color .15s; }
.auth-field input:focus { border-color:var(--red); }
.auth-btn { width:100%; padding:12px; border-radius:5px; border:none; background:var(--red); color:#fff; font-family:var(--f-display); font-size:20px; letter-spacing:1px; cursor:pointer; margin-top:6px; transition:opacity .15s; box-shadow:0 4px 16px rgba(204,27,27,.3); }
.auth-btn:hover { opacity:.88; }
.auth-msg { font-size:12px; text-align:center; margin-top:12px; min-height:18px; }
.auth-msg.err { color:var(--red); }
.auth-msg.ok  { color:var(--green); }

/* ── SIDEBAR ── */
.sidebar { position:fixed; top:0; left:0; bottom:0; width:70px; background:var(--ink); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:18px 0; gap:4px; z-index:100; }
.sidebar::after { content:''; position:absolute; top:0; right:0; bottom:0; width:2px; background:linear-gradient(to bottom,transparent,var(--red) 40%,var(--red) 60%,transparent); opacity:.6; }
.logo-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; margin-bottom:20px; cursor:pointer; }
.logo-icon { width:42px; height:42px; background:var(--red); clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%); display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 0 20px var(--red-glow); }
.logo-text { font-family:var(--f-cond); font-size:9px; font-weight:700; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
.nb { width:42px; height:42px; border-radius:4px; border:none; background:transparent; color:var(--muted); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; position:relative; }
.nb:hover { background:var(--raised); color:var(--white); }
.nb.on { background:var(--red-soft); color:var(--red); box-shadow:inset 2px 0 0 var(--red); }
.nb-logout { color:var(--muted); font-size:16px; }
.nb-logout:hover { color:var(--red); }

/* ── MAIN ── */
.main { margin-left:70px; min-height:100vh; position:relative; z-index:1; }

/* ── TOPBAR ── */
.topbar { height:56px; background:var(--ink); border-bottom:2px solid var(--red); display:flex; align-items:center; padding:0 28px; gap:2px; position:sticky; top:0; z-index:90; }
.tb { padding:6px 18px; border:none; border-radius:3px; background:transparent; color:var(--muted); font-family:var(--f-cond); font-size:14px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .15s; }
.tb:hover { color:var(--white); background:var(--raised); }
.tb.on { color:var(--red); background:var(--red-soft); }
.tb-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
.search { background:var(--raised); border:1px solid var(--line); border-radius:4px; padding:7px 13px; color:var(--white); font-family:var(--f-body); font-size:13px; width:210px; outline:none; transition:border-color .15s; }
.search:focus { border-color:var(--red); }
.search::placeholder { color:var(--muted); }
.user-chip { display:flex; align-items:center; gap:7px; padding:5px 10px; border-radius:4px; background:var(--raised); border:1px solid var(--line); font-family:var(--f-cond); font-size:12px; font-weight:600; letter-spacing:.3px; color:var(--muted); }
.user-dot { width:7px; height:7px; border-radius:50%; background:var(--green); }

/* ── PAGES ── */
.page { display:none; padding:28px; animation:fadeUp .3s ease; }
.page.on { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
