<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVCBtrack</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;padding:20px}
button{padding:10px;margin:5px;cursor:pointer}
input{padding:8px;margin:5px}
.card{background:#222;padding:10px;margin:10px 0;border-radius:8px}
</style>
</head>

<body>

<h2>AVCBtrack</h2>

<input id="nome" placeholder="Nome">
<input id="telefone" placeholder="Telefone">
<input id="venc" type="date">

<br>
<button onclick="salvarCliente()">Salvar Cliente</button>

<div id="lista"></div>

<script>

const SUPABASE_URL = "https://ecqcenkznwivsovnomjn.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZeGAsY811rEb2FFyZo2nTg_6wxzsee8";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function salvarCliente(){

  let nome = document.getElementById("nome").value;
  let telefone = document.getElementById("telefone").value;
  let venc = document.getElementById("venc").value;

  if(!nome || !venc){
    alert("Preencha nome e vencimento");
    return;
  }

  const { error } = await supabaseClient
    .from("clientes")
    .insert([{ nome, telefone, venc }]);

  if(error){
    alert("Erro ao salvar");
    console.log(error);
    return;
  }

  carregarClientes();
}

async function carregarClientes(){

  const { data, error } = await supabaseClient
    .from("clientes")
    .select("*");

  if(error){
    console.log(error);
    return;
  }

  let lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(c => {

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${c.nome}</b><br>
      Vence: ${c.venc}<br>
      📞 <a href="https://wa.me/55${c.telefone}" target="_blank">
      ${c.telefone}
      </a>
    `;

    lista.appendChild(div);
  });
}

carregarClientes();

</script>

</body>
</html>
