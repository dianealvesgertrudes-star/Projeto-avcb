<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AVCBtrack</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:       #CC1B1B;
  --red-deep:  #A01212;
  --red-glow:  rgba(204,27,27,0.18);
  --red-soft:  rgba(204,27,27,0.10);
  --gold:      #D4A843;
  --gold-soft: rgba(212,168,67,0.12);
  --black:     #0A0A0A;
  --ink:       #111111;
  --panel:     #181818;
  --raised:    #222222;
  --line:      rgba(255,255,255,0.07);
  --white:     #F5F2ED;
  --muted:     #706C68;
  --green:     #1FA851;
  --yellow:    #E8A000;
  --blue:      #2563EB;

  --f-display: 'Bebas Neue', sans-serif;
  --f-cond:    'Barlow Condensed', sans-serif;
  --f-body:    'Barlow', sans-serif;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: var(--f-body);
  padding: 40px;
  text-align: center;
}

h1 {
  font-family: var(--f-display);
  font-size: 64px;
  color: var(--red);
  margin-bottom: 20px;
}

p {
  font-size: 20px;
  color: var(--muted);
  margin-bottom: 30px;
}

.box {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 30px;
  border-radius: 12px;
  max-width: 600px;
  margin: 0 auto;
}

button {
  background: var(--red);
  border: none;
  padding: 14px 28px;
  border-radius: 8px;
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  font-family: var(--f-cond);
  letter-spacing: 1px;
}

button:hover {
  background: var(--red-deep);
}
</style>
</head>

<body>

<h1>AVCBtrack</h1>

<div class="box">
  <p>Seu aplicativo está funcionando! Agora você pode personalizar o conteúdo como quiser.</p>
  <button onclick="alert('Botão funcionando!')">Testar botão</button>
</div>

</body>
</html>
